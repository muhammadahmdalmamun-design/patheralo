var X={"0-0":"কীভাবে বাছবেন:\n১. Play Store-এ ৩টি ভার্চুয়াল ডলার কার্ড অ্যাপের নাম খুঁজুন।\n২. প্রতিটির রেটিং ও রিভিউ পড়ুন, বিশেষ করে ১–২ তারার রিভিউ।\n৩. নিচের ‘বাছাই কার্ড’-এর ৮টি প্রশ্নে টিক দিন।\n৪. সবচেয়ে বেশি টিক পাওয়া অ্যাপটি নিন।\n\n⚠ যে অ্যাপে USDT/USDC (ক্রিপ্টো) দিয়ে টাকা ভরতে হয়, সেটা এড়ান। বাংলাদেশ ব্যাংক ক্রিপ্টো লেনদেন অনুমোদন করে না। ব্যাংক, কার্ড বা মোবাইল ব্যাংকিংয়ের বৈধ পথ আছে এমন অ্যাপ দেখুন। না থাকলে আপনার ব্যাংকে আন্তর্জাতিক কার্ডের নিয়ম জিজ্ঞেস করুন।\n\nআমি কোনো অ্যাপকে নিশ্চিতভাবে ‘সেরা’ বলতে পারি না, কারণ ফি ও নিয়ম প্রায়ই বদলায়। নিজে যাচাই করাই নিরাপদ।","0-1":"১. অ্যাপের Help, Support বা চ্যাট খুলুন।\n২. লিখুন: “Will your virtual card work for the Google Play Console $25 registration fee?”\n৩. উত্তরের স্ক্রিনশট রেখে দিন।\n৪. উত্তর ‘হ্যাঁ’ হলে এগোন। ‘নিশ্চিত নই’ বলে বা উত্তর না এলে অন্য অ্যাপ দেখুন।","0-2":"১. শুধু Play Store থেকে অ্যাপ নামান, অন্য লিংক থেকে নয়।\n২. Register বা Sign up চাপুন।\n৩. নিজের নম্বরে OTP আসবে। সেটা শুধু অ্যাপেই দিন, অন্য কাউকে নয়।\n৪. নতুন শক্ত পাসওয়ার্ড দিন, যা অন্য কোথাও ব্যবহার করেননি।\n৫. পাসওয়ার্ড কাগজে লিখে নিরাপদ জায়গায় রাখুন।","0-3":"১. KYC বা Verify identity চাপুন।\n২. জাতীয় পরিচয়পত্রের সামনে ও পেছনের ছবি তুলুন: ভালো আলোতে, সমতলে রেখে, ফ্ল্যাশ ছাড়া, চারপাশ কাটা ছাড়া।\n৩. নিজের মুখের ছবি (সেলফি) তুলুন।\n৪. নাম আইডির মতো হুবহু লিখুন।\n৫. ‘Pending’ দেখালে অপেক্ষা করুন। কয়েক মিনিট থেকে কয়েক দিন লাগতে পারে।","0-4":"১. অ্যাপের Cards বা Virtual card অংশে যান।\n২. Create card চাপুন এবং USD কার্ড বেছে নিন।\n৩. কার্ডের নম্বর, মেয়াদ ও CVV অ্যাপেই দেখা যাবে। শুধু গুগলের পেমেন্ট ঘরেই দিন।\n৪. ‘অনলাইন লেনদেন’ চালু আছে কি না দেখুন।\n৫. কার্ডের ছবি বা নম্বর কাউকে পাঠাবেন না।","0-5":"১. অ্যাপের Add money বা Top up অংশে যান।\n২. অ্যাপ যে বৈধ পথ দেখায় (ব্যাংক, কার্ড বা মোবাইল ব্যাংকিং), সেটি বেছে নিন।\n৩. হিসাব: ফি ২৫ + কার্ড ফি + রেটের ফারাক + ৫ ডলার বাড়তি।\n৪. টাকা ঢোকার স্ক্রিনশট রাখুন।\n৫. কার্ডে ২৫ ডলারের বেশি ব্যালেন্স দেখালে এই ধাপ শেষ।","1-0":"নতুন Gmail বানালে সব আলাদা থাকে। ২-ধাপ যাচাই চালু acitor লাগে, যা কম্পিউটারে চালাতে হয়। অনলাইন কনভার্টার ব্যবহার করলে বিশ্বাসযোগ্যতা যাচাই করুন।","3-3":"উদাহরণ: com.mamun.quranhefz। শুধু ইংরেজি ছোট হাতের অক্ষর ও ডট। একবার প্রকাশ হলে বদলানো যায় না।","3-4":"কী ফাইল হারালে আপডেট দেওয়া কঠিন হয়। গুগল ড্রাইভ ও পেন ড্রাইভে কপি রাখুন। পাসওয়ার্ড লিখে নিরাপদ জায়গায় রাখুন।","3-5":"Play Store-এ AAB দিতে হয়, আর নিজের ফোনে পরীক্ষার জন্য APK কাজে লাগে। বেশিরভাগ টুল দুটোই বানিয়ে দেয়।","3-6":"APK ফোনে বসিয়ে প্রতিটি পাতা চেপে দেখুন। ব্যাক বোতাম, লেখা কাটা পড়ছে কি না, ইন্টারনেট ছাড়া চলছে কি না দেখুন।","4-0":"কনসোলের App content অংশে প্রশ্ন আসবে। অ্যাপে অশ্লীল, সহিংস বা জুয়া বিষয় না থাকলে সহজেই সবার জন্য রেটিং আসে।","4-1":"ফর্মে লিখুন অ্যাপ কোন তথ্য নেয়। ব্যক্তিগত তথ্য না নিলে ‘তথ্য সংগ্রহ করা হয় না’ বেছে নিন। মিথ্যা বললে অ্যাপ বাদ পড়তে পারে।","4-2":"লক্ষ্য বয়স বড়দের বা সবাই বেছে নিলে নিয়ম সহজ। শিশুদের জন্য বানালে গুগলের শিশু-সংক্রান্ত নিয়ম মানতে হয়, তাতে বিজ্ঞাপন ও তথ্য নেওয়ায় কড়াকড়ি আছে।","4-3":"ছোট বিবরণ সংক্ষেপে অ্যাপের কাজ বলে। পূর্ণ বিবরণে সুবিধাগুলো তালিকা করে লিখুন। স্ক্রিনশটে আসল পাতা দেখান।","4-4":"ব্যবহারকারী ভুল ধরিয়ে দিলে ধন্যবাদ জানিয়ে ঠিক করুন। কটু মন্তব্যে রাগ না করে ভদ্রভাবে উত্তর দিন।","4-5":"প্রতিবার নতুন সংস্করণে version code আগের চেয়ে বড় সংখ্যা দিতে হয়, যেমন ১, তারপর ২, ৩।","4-6":"গুগলের কোনো নোটিশে সময়সীমা থাকলে তার মধ্যে উত্তর দিন। ইমেইল দেখার অভ্যাস না থাকলে একাউন্ট সমস্যায় পড়তে পারে।"};
